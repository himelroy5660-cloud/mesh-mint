
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>3D Model Generator</title>

    <link rel="stylesheet" href="style.css">

    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js"
        }
    }
    </script>
</head>

<body>

    <header>
        <h2>3D Model Generator</h2>
        <p>Three.js to GLTF / GLB</p>
    </header>

    <main>

        <!-- Code Editor -->
        <section class="editor">

            <h3>JavaScript Editor</h3>

            <textarea
                id="code"
                spellcheck="false"
                placeholder="Write your Three.js code here..."
            ></textarea>

            <button id="runBtn">Run Code</button>

            <p id="status">Ready</p>

        </section>

        <!-- 3D Preview -->
        <section class="preview">

            <h3>3D Preview</h3>

            <div id="preview"></div>

            <p class="preview-hint">
                Drag to rotate · Pinch to zoom
            </p>

            <button id="exportBtn">
                Export GLB
            </button>

            <button id="exportGltfBtn">
                Export GLTF
            </button>

        </section>

    </main>

    <!-- Bottom Test Advertisement -->
    <div class="bottom-ad">

        <div class="ad-content">

            <span class="ad-label">ADVERTISEMENT · TEST</span>

            <strong>Test Advertisement</strong>

            <p>Your advertisement will appear here.</p>

        </div>

        <span class="ad-test">TEST AD</span>

    </div>

    <!-- Main JavaScript -->
    <script type="module" src="script.js"></script>

</body>
</html>
